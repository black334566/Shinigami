<!-- file: index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UNO Web App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a2e;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        #header {
            text-align: center;
            padding: 10px;
            background: #16213e;
            font-weight: bold;
        }
        #game-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 10px;
        }
        .center-area {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 50px;
        }
        .deck, .discard {
            width: 80px;
            height: 120px;
            border-radius: 10px;
            background-size: cover;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }
        .deck { background-color: #2a2a2a; border: 2px dashed #555; }
        .hand {
            display: flex;
            overflow-x: auto;
            padding-bottom: 10px;
            gap: 5px;
        }
        .card {
            width: 70px;
            height: 105px;
            flex-shrink: 0;
            border-radius: 8px;
            background-size: cover;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .card:active { transform: translateY(-10px); }
        #player-info {
            text-align: center;
            margin-top: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div id="header">🎴 UNO Arena</div>
    
    <div id="game-area">
        <div class="center-area">
            <div class="deck" onclick="drawCard()"></div>
            <div class="discard" id="discard-pile"></div>
        </div>
        
        <div id="player-info">Waiting for game state...</div>
        
        <div class="hand" id="player-hand">
            <!-- ကတ်တွေ ဒီမှာ ပေါ်လာမယ် -->
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // App ကို အပြည့်ဖွင့်

        // ကတ်ပုံတွေအတွက် Base URL
        const IMG_BASE = "https://raw.githubusercontent.com/ImaginaryDevelopment/Uno/master/Uno/Images/Cards/";

        // နမူနာ ကတ်တွေ (Backend ကနေ လာတဲ့အခါ ဒါကို အစားထိုးရမယ်)
        let myHand = [
            { color: "Blue", type: "7" },
            { color: "Blue", type: "Draw2" },
            { color: "Green", type: "8" },
            { color: "Red", type: "9" }
        ];

        function getCardImage(card) {
            if (card.type === "Wild") return IMG_BASE + "Wild.png";
            if (card.type === "Wild4") return IMG_BASE + "Wild_Draw4.png";
            return IMG_BASE + card.color + "_" + card.type + ".png";
        }

        function renderHand() {
            const handDiv = document.getElementById('player-hand');
            handDiv.innerHTML = '';
            myHand.forEach((card, index) => {
                const cardDiv = document.createElement('div');
                cardDiv.className = 'card';
                cardDiv.style.backgroundImage = `url('${getCardImage(card)}')`;
                cardDiv.onclick = () => playCard(index);
                handDiv.appendChild(cardDiv);
            });
        }

        function playCard(index) {
            // Backend ကို ကတ်ဆော့တဲ့အကြောင်း အသိပေးမယ်
            tg.sendData(JSON.stringify({ action: "play", card_index: index }));
            tg.close();
        }

        function drawCard() {
            tg.sendData(JSON.stringify({ action: "draw" }));
            tg.close();
        }

        // စတင်ပြသမယ်
        renderHand();
        document.getElementById('discard-pile').style.backgroundImage = `url('${getCardImage({color:"Red", type:"9"})}')`;
    </script>
</body>
</html>
