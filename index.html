<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shinigami Uno Game</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #07090e;
            --card-bg: #111827;
            --border-color: rgba(255, 255, 255, 0.08);
            --accent-glow: rgba(56, 189, 248, 0.2);
        }
        body {
            background: radial-gradient(circle at center, #111827 0%, #07090e 100%);
            color: #ffffff;
            font-family: 'Outfit', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        /* Lobby Screen */
        #lobby-screen {
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(16px);
            padding: 35px 25px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            border: 1px solid var(--border-color);
        }
        h2 {
            margin: 0 0 5px 0;
            color: #38bdf8;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
        }
        .subtitle {
            font-size: 11px;
            color: #64748b;
            margin-bottom: 30px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }
        .label {
            text-align: left;
            font-size: 11px;
            color: #94a3b8;
            margin-bottom: 8px;
            font-weight: 600;
            letter-spacing: 1px;
        }
        input {
            width: 100%;
            padding: 14px 16px;
            margin-bottom: 20px;
            background: rgba(7, 9, 14, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            border-radius: 12px;
            box-sizing: border-box;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }
        input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 15px var(--accent-glow);
        }
        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            font-size: 15px;
            letter-spacing: 0.5px;
            transition: transform 0.2s, opacity 0.2s;
        }
        button:active { transform: scale(0.97); }
        .btn-create { 
            background: linear-gradient(135deg, #10b981, #059669); 
            color: white; 
            box-shadow: 0 4px 20px rgba(16, 185, 129, 0.4);
        }

        /* Game Screen */
        #game-screen {
            display: none;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px 15px;
            box-sizing: border-box;
        }
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(17, 24, 39, 0.8);
            backdrop-filter: blur(10px);
            padding: 12px 18px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            font-size: 13px;
            font-weight: 600;
        }
        .game-board {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin: auto 0;
        }
        
        /* Premium Uno Cards */
        .uno-card {
            width: 75px;
            height: 110px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            font-weight: 800;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5), inset 0 2px 3px rgba(255,255,255,0.3);
            cursor: pointer;
            user-select: none;
            position: relative;
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .uno-card:hover { transform: translateY(-8px) scale(1.05); }
        
        .card-red { background: linear-gradient(135deg, #f87171, #dc2626); color: white; border: 2px solid rgba(255,255,255,0.2); }
        .card-blue { background: linear-gradient(135deg, #60a5fa, #2563eb); color: white; border: 2px solid rgba(255,255,255,0.2); }
        .card-green { background: linear-gradient(135deg, #34d399, #059669); color: white; border: 2px solid rgba(255,255,255,0.2); }
        .card-yellow { background: linear-gradient(135deg, #fbbf24, #d97706); color: white; border: 2px solid rgba(255,255,255,0.2); }
        .card-back { background: linear-gradient(135deg, #334155, #1e293b); color: #94a3b8; border: 2px dashed rgba(255,255,255,0.2); }

        .player-hand-container {
            background: rgba(17, 24, 39, 0.8);
            backdrop-filter: blur(12px);
            padding: 12px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
        }
        .player-hand {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 5px;
            justify-content: flex-start;
            scrollbar-width: none;
        }
        .player-hand::-webkit-scrollbar { display: none; }
        
        .status-text {
            font-size: 13px;
            color: #38bdf8;
            margin-bottom: 15px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
        }
    </style>
</head>
<body>

    <!-- 1. LOBBY SCREEN -->
    <div id="lobby-container" class="container">
        <div id="lobby-screen">
            <h2>SHINIGAMI</h2>
            <div class="subtitle">UNO ARENA</div>

            <div class="label">PLAYER NAME</div>
            <input type="text" id="playerName" placeholder="Enter name...">

            <button class="btn-create" onclick="startGame()">⚡ Start Game</button>
        </div>
    </div>

    <!-- 2. GAME SCREEN -->
    <div id="game-screen" class="container" style="display: none;">
        <div class="game-header">
            <span id="room-info" style="color: #38bdf8;">🎴 Room #UNO</span>
            <span id="player-score" style="background: rgba(56,189,248,0.1); padding: 4px 10px; border-radius: 8px; color: #38bdf8;">Cards: 5</span>
        </div>

        <div>
            <div class="status-text" id="game-status">✨ သင်၏အလှည့် (Your Turn)</div>
            <div class="game-board">
                <div class="uno-card card-back" onclick="drawCard()">
                    <span style="font-size: 20px;">📦</span>
                    <span style="font-size: 9px; margin-top: 4px; letter-spacing: 1px;">DRAW</span>
                </div>
                <div id="center-card" class="uno-card card-red">7</div>
            </div>
        </div>

        <div class="player-hand-container">
            <div style="font-size: 11px; color: #94a3b8; margin-bottom: 8px; text-align: left; font-weight: 600; letter-spacing: 1px;">YOUR CARDS</div>
            <div class="player-hand" id="playerHand">
                <!-- Cards injected dynamically -->
            </div>
        </div>
    </div>

    <script>
        window.onload = function() {
            if (window.Telegram && window.Telegram.WebApp) {
                const tg = window.Telegram.WebApp;
                tg.expand();
                if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                    document.getElementById('playerName').value = tg.initDataUnsafe.user.first_name;
                }
            }
        };

        let handCards = [
            {color: 'red', value: '3'},
            {color: 'blue', value: '5'},
            {color: 'green', value: '⚡'},
            {color: 'yellow', value: '9'},
            {color: 'red', value: '+2'}
        ];

        let centerCard = {color: 'red', value: '7'};

        function startGame() {
            const name = document.getElementById('playerName').value.trim();
            if (!name) {
                alert("ကျေးဇူးပြု၍ နာမည်ထည့်ပါ။");
                return;
            }
            document.getElementById('lobby-container').style.display = 'none';
            document.getElementById('game-screen').style.display = 'flex';
            renderHand();
            updateCenterCard();
        }

        function renderHand() {
            const handEl = document.getElementById('playerHand');
            handEl.innerHTML = '';
            handCards.forEach((card, index) => {
                const cardDiv = document.createElement('div');
                cardDiv.className = `uno-card card-${card.color}`;
                cardDiv.innerText = card.value;
                cardDiv.onclick = () => playCard(index);
                handEl.appendChild(cardDiv);
            });
            document.getElementById('player-score').innerText = `Cards: ${handCards.length}`;
        }

        function updateCenterCard() {
            const centerEl = document.getElementById('center-card');
            centerEl.className = `uno-card card-${centerCard.color}`;
            centerEl.innerText = centerCard.value;
        }

        function playCard(index) {
            const card = handCards[index];
            if (card.color === centerCard.color || card.value === centerCard.value || card.value === '⚡') {
                centerCard = card;
                handCards.splice(index, 1);
                updateCenterCard();
                renderHand();
                
                if (handCards.length === 0) {
                    document.getElementById('game-status').innerText = "🎉 ဂိမ်းအောင်မြင်စွာ နိုင်သွားပါပြီ!";
                } else {
                    document.getElementById('game-status').innerText = "🔥 ကတ်ချလိုက်ပါပြီ ဆက်ကစားပါ...";
                    setTimeout(() => {
                        document.getElementById('game-status').innerText = "✨ သင်၏အလှည့် (Your Turn)";
                    }, 1000);
                }
            } else {
                alert("⚠️ အရောင် သို့မဟုတ် နံပါတ် တူညီသောကတ်ကိုသာ ချရပါမည်။");
            }
        }

        function drawCard() {
            const colors = ['red', 'blue', 'green', 'yellow'];
            const values = ['1', '2', '4', '6', '8'];
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            const randomVal = values[Math.floor(Math.random() * values.length)];
            
            handCards.push({color: randomColor, value: randomVal});
            renderHand();
            document.getElementById('game-status').innerText = "📦 ကတ်အသစ် တစ်ကတ် နှိုက်လိုက်ပါပြီ။";
        }
    </script>
</body>
</html>
