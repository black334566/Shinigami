<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNO - Telegram Game</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --glass-bg: rgba(15, 23, 42, 0.85);
            --green-theme: #15803d;
            --green-glow: rgba(34, 197, 94, 0.4);
        }
        body {
            background: linear-gradient(135deg, #14532d 0%, #166534 50%, #052e16 100%);
            color: #ffffff;
            font-family: 'Outfit', sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        body::before {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 24px 24px;
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px;
            box-sizing: border-box;
            position: relative;
            z-index: 1;
        }

        /* --- LOBBY SCREEN --- */
        #lobby-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #14532d 0%, #052e16 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
        }
        .lobby-card {
            background: rgba(18, 24, 38, 0.95);
            backdrop-filter: blur(20px);
            padding: 25px 20px;
            border-radius: 20px;
            width: 100%;
            max-width: 360px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }
        .lobby-title {
            font-size: 32px;
            font-weight: 800;
            color: #ffffff;
            margin: 0;
            letter-spacing: 2px;
        }
        .lobby-subtitle {
            font-size: 11px;
            color: #94a3b8;
            letter-spacing: 3px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }
        .input-group {
            text-align: left;
            margin-bottom: 12px;
        }
        .input-label {
            font-size: 10px;
            font-weight: 700;
            color: #94a3b8;
            letter-spacing: 1px;
            margin-bottom: 5px;
            display: block;
        }
        .styled-input {
            width: 100%;
            padding: 10px 14px;
            background: #0b0f19;
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 14px;
            outline: none;
            font-family: 'Outfit', sans-serif;
        }
        .styled-input:focus { border-color: #22c55e; }
        
        /* Bot Selector Options */
        .bot-select-row {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }
        .bot-btn-opt {
            flex: 1;
            padding: 8px;
            background: #0b0f19;
            border: 1px solid rgba(255,255,255,0.1);
            color: #94a3b8;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .bot-btn-opt.active {
            background: #15803d;
            border-color: #22c55e;
            color: #fff;
            box-shadow: 0 0 10px rgba(34,197,94,0.3);
        }

        .btn-create {
            width: 100%;
            padding: 12px;
            background: #10b981;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
            margin-bottom: 12px;
        }
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: #64748b;
            font-size: 10px;
            margin: 12px 0;
            letter-spacing: 2px;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .divider::before { margin-right: 10px; }
        .divider::after { margin-left: 10px; }

        .join-row {
            display: flex;
            gap: 10px;
        }
        .btn-join {
            padding: 12px 20px;
            background: #6366f1;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
        }

        /* --- GAME SCREEN --- */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            background: rgba(0,0,0,0.3);
            padding: 8px 12px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .top-badge {
            background: rgba(255,255,255,0.1);
            padding: 3px 8px;
            border-radius: 6px;
            font-weight: 600;
        }

        /* Bots Header */
        .bots-container {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-top: 8px;
            min-height: 60px;
        }
        .bot-profile {
            text-align: center;
            transition: opacity 0.3s;
        }
        .bot-profile.hidden {
            display: none;
        }
        .bot-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 2px solid #f59e0b;
            background: #1e293b;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 10px;
            font-weight: bold;
            position: relative;
            margin: 0 auto 4px auto;
        }
        .bot-cards-badge {
            position: absolute;
            bottom: -2px;
            right: -2px;
            background: #0f172a;
            border: 1px solid #64748b;
            font-size: 9px;
            padding: 1px 4px;
            border-radius: 8px;
        }
        .bot-name {
            font-size: 10px;
            color: #cbd5e1;
        }

        /* Center Board & Stacked Cards */
        .center-board {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: auto 0;
            position: relative;
        }
        .color-indicator {
            background: rgba(0,0,0,0.6);
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 10px;
            letter-spacing: 1px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .color-dot {
            width: 8px;
            height: 8px;
            background: #ef4444;
            border-radius: 50%;
        }

        .cards-pile {
            display: flex;
            gap: 15px;
            position: relative;
            cursor: pointer;
        }
        .uno-card {
            width: 65px;
            height: 95px;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 26px;
            font-weight: 800;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            cursor: pointer;
            user-select: none;
            position: relative;
            transition: transform 0.2s;
        }
        .uno-card:hover { transform: translateY(-5px); }
        .card-red { background: linear-gradient(135deg, #ef4444, #991b1b); color: white; border: 2px solid #f87171; }
        .card-blue { background: linear-gradient(135deg, #3b82f6, #1e40af); color: white; border: 2px solid #60a5fa; }
        .card-green { background: linear-gradient(135deg, #10b981, #065f46); color: white; border: 2px solid #34d399; }
        .card-yellow { background: linear-gradient(135deg, #f59e0b, #b45309); color: white; border: 2px solid #fbbf24; }
        .card-back { background: #1e293b; color: #cbd5e1; border: 2px dashed #475569; font-size: 12px; text-align: center; }

        .action-buttons-right {
            position: absolute;
            right: -10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .btn-action-small {
            background: #059669;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 9px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .btn-chat {
            background: #1e293b;
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* Player Bottom Section */
        .player-footer {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            padding: 12px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .player-info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 11px;
        }
        .player-hand {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
            scrollbar-width: none;
        }
        .player-hand::-webkit-scrollbar { display: none; }

        /* --- ROOM CHAT MODAL --- */
        #chat-modal {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 50;
            padding: 20px;
            box-sizing: border-box;
        }
        .chat-card {
            background: #111827;
            border: 1px solid rgba(255,255,255,0.1);
            width: 100%;
            max-width: 340px;
            border-radius: 16px;
            padding: 15px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.5);
        }
        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 8px;
        }
        .chat-messages {
            height: 110px;
            background: #0b0f19;
            border-radius: 8px;
            padding: 8px;
            font-size: 11px;
            color: #cbd5e1;
            overflow-y: auto;
            margin-bottom: 10px;
            text-align: left;
        }
        .chat-input-row {
            display: flex;
            gap: 8px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- LOBBY SCREEN -->
        <div id="lobby-screen">
            <div class="lobby-card">
                <h1 class="lobby-title">UNO</h1>
                <div class="lobby-subtitle">Lobby Access</div>
                
                <div class="input-group">
                    <span class="input-label">PLAYER NAME</span>
                    <input type="text" id="playerName" class="styled-input" value="Mist.Hermit">
                </div>

                <div class="input-group">
                    <span class="input-label">CHOOSE BOT OPPONENTS</span>
                    <div class="bot-select-row">
                        <button class="bot-btn-opt" onclick="setBotCount(1)" id="bOpt1">1 Bot</button>
                        <button class="bot-btn-opt" onclick="setBotCount(2)" id="bOpt2">2 Bots</button>
                        <button class="bot-btn-opt active" onclick="setBotCount(3)" id="bOpt3">3 Bots</button>
                    </div>
                </div>

                <button class="btn-create" onclick="createLobby()">+ Create Lobby</button>

                <div class="divider">OR JOIN FRIEND</div>

                <div class="join-row">
                    <input type="text" id="roomCodeInput" class="styled-input" placeholder="ROOM CODE" style="text-align: center; letter-spacing: 2px; text-transform: uppercase;">
                    <button class="btn-join" onclick="joinLobby()">Join →</button>
                </div>
            </div>
        </div>

        <!-- TOP BAR -->
        <div class="top-bar">
            <span>🎴 <b id="roomTitleDisplay">Room #UNO-99</b></span>
            <div style="display: flex; gap: 6px;">
                <span class="top-badge" id="onlineCount">👁️ 1</span>
                <span class="top-badge" onclick="shareRoomCode()" style="cursor: pointer; background: #15803d;">🔗 SHARE</span>
            </div>
        </div>

        <!-- BOTS OPPONENTS -->
        <div class="bots-container" id="botsContainer">
            <div class="bot-profile" id="bot1Box">
                <div class="bot-avatar">🤖<div class="bot-cards-badge" id="bot1Cards">6</div></div>
                <div class="bot-name">Bot Alpha</div>
            </div>
            <div class="bot-profile" id="bot2Box">
                <div class="bot-avatar">🤖<div class="bot-cards-badge" id="bot2Cards">5</div></div>
                <div class="bot-name">Bot Beta</div>
            </div>
            <div class="bot-profile" id="bot3Box">
                <div class="bot-avatar" style="border-color: #eab308;">🤖<div class="bot-cards-badge" id="bot3Cards">4</div></div>
                <div class="bot-name" style="color: #eab308;">Bot Gamma</div>
            </div>
        </div>

        <!-- CENTER BOARD -->
        <div class="center-board">
            <div class="color-indicator">
                <span>COLOR</span> <div class="color-dot" id="centerColorDot" style="background: #ef4444;"></div>
            </div>

            <div class="cards-pile">
                <div class="uno-card card-back" onclick="drawCard()">
                    <span style="font-size: 16px;">📦</span>
                    <span style="font-size: 9px; margin-top: 2px;">DRAW</span>
                </div>
                <div id="centerCard" class="uno-card card-red" onclick="playCenterCard()">7</div>
            </div>

            <div class="action-buttons-right">
                <button class="btn-action-small" onclick="callSafe()">SAFE</button>
                <button class="btn-action-small btn-chat" onclick="toggleChat(true)">💬 CHAT</button>
            </div>
        </div>

        <!-- PLAYER FOOTER -->
        <div class="player-footer">
            <div class="player-info-row">
                <span style="color: #4ade80; font-weight: 700;" id="myDisplayName">⭐ You (Mist.Hermit)</span>
                <span style="color: #facc15; font-size: 10px;" id="gameStatusText">YOUR TURN!</span>
            </div>
            <div class="player-hand" id="playerHand">
                <!-- Cards injected -->
            </div>
        </div>
    </div>

    <!-- ROOM CHAT MODAL POPUP -->
    <div id="chat-modal">
        <div class="chat-card">
            <div class="chat-header">
                <div>
                    <div style="font-weight: 700; font-size: 14px;">ROOM CHAT</div>
                    <div style="font-size: 9px; color: #94a3b8;">LIVE DISCUSSION</div>
                </div>
                <button onclick="toggleChat(false)" style="background:none; border:none; color:#fff; font-size:16px; cursor:pointer;">✕</button>
            </div>
            <div class="chat-messages" id="chatMessagesBox">
                💬 System: Room connected successfully. Let's play UNO!
            </div>
            <div class="chat-input-row">
                <input type="text" id="chatInputText" class="styled-input" placeholder="Say something..." style="padding: 8px 10px; font-size: 12px;">
                <button class="btn-join" onclick="sendChatMessage()" style="padding: 8px 12px;">➤</button>
            </div>
        </div>
    </div>

    <script>
        let selectedBotCount = 3;
        let currentRoomCode = "SHINIGAMI";
        let handCards = [
            {color: 'red', value: '3'},
            {color: 'blue', value: '5'},
            {color: 'green', value: 'Skip'},
            {color: 'yellow', value: '9'},
            {color: 'red', value: '+2'}
        ];
        let centerCard = {color: 'red', value: '7'};
        let botCardCounts = [6, 5, 4];

        window.onload = function() {
            if (window.Telegram && window.Telegram.WebApp) {
                const tg = window.Telegram.WebApp;
                tg.expand();
                if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                    document.getElementById('playerName').value = tg.initDataUnsafe.user.first_name;
                }
            }
            
            // Check if URL has room code
            const urlParams = new URLSearchParams(window.location.search);
            const room = urlParams.get('room');
            if(room) {
                document.getElementById('roomCodeInput').value = room;
            }
        };

        function setBotCount(count) {
            selectedBotCount = count;
            document.querySelectorAll('.bot-btn-opt').forEach((btn, idx) => {
                if((idx + 1) === count) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }

        function createLobby() {
            const name = document.getElementById('playerName').value.trim();
            if (!name) {
                alert("ကျေးဇူးပြု၍ နာမည်ထည့်ပါ။");
                return;
            }
            currentRoomCode = Math.random().toString(36).substring(2, 8).toUpperCase();
            initGameSession(name, currentRoomCode);
        }

        function joinLobby() {
            const name = document.getElementById('playerName').value.trim();
            const code = document.getElementById('roomCodeInput').value.trim().toUpperCase();
            if (!name) {
                alert("ကျေးဇူးပြု၍ နာမည်ထည့်ပါ။");
                return;
            }
            if (!code) {
                alert("ကျေးဇူးပြု၍ Room Code ထည့်ပါ။");
                return;
            }
            currentRoomCode = code;
            initGameSession(name, currentRoomCode);
        }

        function initGameSession(name, code) {
            document.getElementById('myDisplayName').innerText = `⭐ You (${name})`;
            document.getElementById('roomTitleDisplay').innerText = `Room #${code}`;
            document.getElementById('lobby-screen').style.display = 'none';

            // Adjust UI based on selected bot count
            document.getElementById('bot1Box').style.display = selectedBotCount >= 1 ? 'block' : 'none';
            document.getElementById('bot2Box').style.display = selectedBotCount >= 2 ? '
